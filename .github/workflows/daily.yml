name: SkyCheck diario

on:
  schedule:
    - cron: "17 11 * * *"   # todos los días 08:17 hora Argentina (11:17 UTC)
  workflow_dispatch: {}      # botón "Run workflow" para correrlo a mano

permissions:
  contents: write            # para guardar el historial de precios en el repo

concurrency:
  group: skycheck
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Buscar vuelos y enviar resumen
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python -m skycheck.main

      - name: Guardar historial
        if: always()
        run: |
          git config user.name "skycheck-bot"
          git config user.email "skycheck-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Historial de precios $(date -u +%F)"
          git push
